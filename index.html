<head>

<style>
.font-bebas{font-family:'Bebas Neue','Oswald',sans-serif}.font-oswald{font-family:'Oswald',sans-serif}.font-inter{font-family:'Inter',sans-serif}
.paper-texture{background-color:#eee9df;background-image:radial-gradient(#cfc8b8 .75px,transparent .75px),radial-gradient(#dcd5c7 .75px,#eee9df .75px);background-size:28px 28px;background-position:0 0,14px 14px}
.distressed-text{letter-spacing:.02em;color:#1a1715;text-shadow:1px 1px 0 rgba(0,0,0,.12)}
.brush-ribbon{background:#183e74;position:relative;clip-path:polygon(0 8%,4% 0,12% 6%,25% 1%,50% 7%,75% 2%,92% 8%,100% 0,99% 92%,93% 100%,82% 94%,55% 98%,30% 93%,12% 100%,0 90%);filter:drop-shadow(1px 2px 2px rgba(0,0,0,.22))}
.splatter-bjp{background:radial-gradient(circle,#f36621f2 0,#f98e3ccc 55%,#eb6e1e00 72%);border-radius:46% 54% 52% 48%/48% 52% 48% 52%}
.splatter-inc{background:radial-gradient(circle at 50% 25%,#f36621d9 0,#f3662199 28%,#ffffffe6 35%,#ffffffe0 60%,#138808d9 68%,#13880800 78%);border-radius:52% 48% 55% 45%/45% 55% 45% 55%}
.splatter-cjp{background:radial-gradient(circle,#8e6ea8e6 0,#af92c9bf 55%,#8e6ea800 75%);border-radius:50% 50% 45% 55%/53% 47% 53% 47%}
.poll-bar{position:relative;overflow:hidden;transition:width .9s cubic-bezier(.25,1,.5,1)}
.poll-bar:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#ffffff26,#0000001a);opacity:.6;mix-blend-mode:overlay}
.brush-underline{position:relative;display:inline-block}.brush-underline:after{content:"";position:absolute;bottom:-6px;left:3px;right:3px;height:4px;background:currentColor;border-radius:40% 60% 70% 30%/40% 50% 60% 50%;opacity:.85;transform:rotate(-1deg)}
.grunge-overlay{background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.05'/%3E%3C/svg%3E")}
.collapse-transition{transition:all .35s cubic-bezier(.4,0,.2,1)}

.parliament-blend{
  mask-image:radial-gradient(circle at 75% 30%,black 35%,transparent 75%);
  -webkit-mask-image:radial-gradient(circle at 75% 30%,black 35%,transparent 75%);
  filter:grayscale(100%) contrast(140%) brightness(95%) sepia(20%);
  mix-blend-mode:multiply;
}

/* Full-screen data loading cover */
#data-loading-cover{
  position:fixed;inset:0;z-index:9999;
  background:rgba(238,233,223,.98);
  display:flex;align-items:center;justify-content:center;
  transition:opacity .25s ease,visibility .25s ease;
}
#data-loading-cover.hidden{opacity:0;visibility:hidden;pointer-events:none}
.loading-box{text-align:center;color:#1a1715;padding:28px}
.loading-spinner{
  width:48px;height:48px;margin:0 auto 18px;
  border:4px solid rgba(24,62,116,.18);
  border-top-color:#183e74;border-radius:50%;
  animation:surveySpin .8s linear infinite;
}
@keyframes surveySpin{to{transform:rotate(360deg)}}
#loading-title{font-family:'Oswald',sans-serif;font-size:24px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
#loading-detail{font-size:12px;font-weight:700;color:#6b655b;margin-top:5px;min-height:18px}
@media(max-width:639px){
  body{padding-bottom:86px!important}
  #reload-poll-btn{
    position:fixed!important;left:14px;right:14px;bottom:54px;
    width:auto!important;z-index:1000;
  }
  main>footer{
    position:fixed!important;left:0;right:0;bottom:0;z-index:999;
    padding:9px 14px!important;background:rgba(238,233,223,.97);
    border-top:1px solid #cfc8b6!important;
    
  }
}

#reload-poll-btn:disabled{
  opacity:.5;
  cursor:not-allowed;
  transform:none!important;
}
#reload-countdown{
  font-variant-numeric:tabular-nums;
}

<script>
document.addEventListener('DOMContentLoaded',()=>{

const POSTS=[
 {id:"choose-1",url:"https://www.reddit.com/user/Calm-Alarm7977/comments/1w3auzc/choose/"},
 {id:"choose-2",url:"https://www.reddit.com/user/Calm-Alarm7977/comments/1w3av3g/choose/"}
];

const RSS_ENDPOINT="/api/reddit-rss";
const ATOM_NS="http://www.w3.org/2005/Atom";
const MAX_RETRIES=3;
const RETRY_DELAYS=[1,2,4];

const ANSWERS={
 "1":"INDIA","INDIA":"INDIA","INC":"INDIA","CONGRESS":"INDIA",
 "2":"NDA","NDA":"NDA","BJP":"NDA",
 "3":"CJP_INDIA","4":"CJP_NDA","CJP":"CJP"
};

const state={isCjpHidden:false,rawVotes:[]};

const RELOAD_COOLDOWN_MS = 60 * 1000;
const CACHE_TIME_KEY = "electionSurvey2029:lastSuccessfulFetch";
let reloadTimer = null;

function getLastFetchTime(){
  const value = Number(localStorage.getItem(CACHE_TIME_KEY));
  return Number.isFinite(value) && value > 0 ? value : 0;
}

function setLastFetchTime(){
  localStorage.setItem(CACHE_TIME_KEY, String(Date.now()));
}

function updateReloadButton(){
  const button = $("reload-poll-btn");
  const countdown = $("reload-countdown");
  const remaining = Math.max(0, RELOAD_COOLDOWN_MS - (Date.now() - getLastFetchTime()));

  if(remaining > 0){
    button.disabled = true;
    countdown.textContent = "(" + Math.ceil(remaining / 1000) + "s)";
    return false;
  }

  button.disabled = false;
  countdown.textContent = "";
  return true;
}

function startReloadCooldown(){
  if(reloadTimer) clearInterval(reloadTimer);
  updateReloadButton();
  reloadTimer = setInterval(function(){
    if(updateReloadButton()){
      clearInterval(reloadTimer);
      reloadTimer = null;
    }
  }, 250);
}

const $=id=>document.getElementById(id);
const loadingCover=$("data-loading-cover");
const loadingTitle=$("loading-title");
const loadingDetail=$("loading-detail");

function showLoading(title,detail){
  loadingTitle.textContent=title;
  loadingDetail.textContent=detail;
  loadingCover.classList.remove("hidden");
}
function hideLoading(){
  loadingCover.classList.add("hidden");
}
const bjpBar=$("bar-bjp"),incBar=$("bar-inc"),cjpBar=$("bar-cjp");
const bjpNum=$("num-bjp"),incNum=$("num-inc"),cjpNum=$("num-cjp");

const status=document.createElement("div");
status.className="hidden";
status.innerHTML='<span class="w-3 h-3 border-2 border-white/30 border-t-white rounded-full animate-spin"></span><span id="live-status"></span>';
document.body.appendChild(status);

function showStatus(text){
  $("live-status").textContent=text;
  status.classList.remove("opacity-0");status.classList.add("opacity-100");
  if (text.startsWith("Retrying")) {
    showLoading("Retrying", text.replace("Retrying ",""));
  } else {
    showLoading("Loading Survey", text);
  }
}
function hideStatus(){status.classList.remove("opacity-100");status.classList.add("opacity-0");hideLoading()}

function makeRssUrl(value){
 const url=new URL(value.trim());
 if(!/(^|\.)reddit\.com$/i.test(url.hostname))throw Error("Not a Reddit URL");
 url.search="";url.hash="";
 url.pathname=url.pathname.replace(/\.(rss|json)$/i,"").replace(/\/+$/,"")+".rss";
 return url.href;
}
function children(parent,name){
 return Array.from(parent.children).filter(el=>el.localName===name&&(el.namespaceURI===ATOM_NS||!el.namespaceURI));
}
function child(parent,name){return children(parent,name)[0]||null}
function textChild(parent,name){const el=child(parent,name);return el?el.textContent.trim():""}

function parseFeed(xmlText){
 const xml=new DOMParser().parseFromString(xmlText,"application/xml");
 if(xml.getElementsByTagName("parsererror").length)throw Error("Invalid RSS");
 if(!xml.documentElement||xml.documentElement.localName!=="feed")throw Error("Not an Atom feed");
 return children(xml.documentElement,"entry").map(entry=>{
  const id=textChild(entry,"id"),authorEl=child(entry,"author"),contentEl=child(entry,"content");
  const linkEl=children(entry,"link").find(el=>el.getAttribute("href"));
  return {id,type:id.startsWith("t3_")?"post":id.startsWith("t1_")?"comment":"other",
   content:contentEl?contentEl.textContent:"",author:authorEl?textChild(authorEl,"name").replace(/^\/u\//,""):"",
   link:linkEl?linkEl.getAttribute("href"):""};
 });
}

function normalizeVote(text){
 const value=String(text||"").replace(/<[^>]*>/g," ").replace(/&nbsp;/gi," ").trim().toUpperCase().replace(/\s+/g," ");
 const clean=value.replace(/^[\s"'`*_.,:;!?()[\]{}<>-]+|[\s"'`*_.,:;!?()[\]{}<>-]+$/g,"");
 return ANSWERS[clean]||null;
}
function effectiveParty(raw){
 if(raw==="CJP_INDIA")return state.isCjpHidden?"INDIA":"CJP";
 if(raw==="CJP_NDA")return state.isCjpHidden?"NDA":"CJP";
 return raw;
}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}

async function fetchPost(post,index){
 const rssUrl=makeRssUrl(post.url);
 const endpointUrl=RSS_ENDPOINT+"?url="+encodeURIComponent(rssUrl);

 for(let attempt=0;attempt<=MAX_RETRIES;attempt++){
  try{
   showStatus(`Loading ${index+1}/${POSTS.length}…`);
   const response=await fetch(endpointUrl,{method:"GET",cache:"no-store"});
   const text=await response.text();

   if(!response.ok){
    if(![429,500,502,503,504].includes(response.status)||attempt===MAX_RETRIES)
      throw Error("HTTP "+response.status);
   }else{
    return parseFeed(text);
   }
  }catch(error){
   if(attempt===MAX_RETRIES)throw error;
  }

  const seconds=RETRY_DELAYS[attempt]||4;
  for(let n=seconds;n>0;n--){
   showStatus(`Retrying in ${n}s…`);
   await sleep(1000);
  }
 }
 throw Error("Fetch failed");
}

function animateNumber(el,to){
 const from=parseInt(el.textContent,10)||0,start=performance.now(),duration=750;
 function tick(now){
  const p=Math.min((now-start)/duration,1),e=1-Math.pow(1-p,3);
  el.textContent=Math.round(from+(to-from)*e);
  if(p<1)requestAnimationFrame(tick);
 }
 requestAnimationFrame(tick);
}

function render(){
 const c={INDIA:0,NDA:0,CJP:0};
 state.rawVotes.forEach(v=>c[effectiveParty(v)]++);
 const total=c.INDIA+c.NDA+c.CJP;

 const india=total?Math.round(c.INDIA/total*100):0;
 const nda=total?Math.round(c.NDA/total*100):0;
 const cjp=total?Math.round(c.CJP/total*100):0;

 bjpBar.style.width=india+"%";incBar.style.width=nda+"%";cjpBar.style.width=cjp+"%";
 animateNumber(bjpNum,india);animateNumber(incNum,nda);animateNumber(cjpNum,cjp);
 $("resp-count").textContent=total.toLocaleString("en-IN");
}

async function loadSurvey(){
 showLoading("Loading Survey","Fetching Reddit data…");
 state.rawVotes=[];
 bjpBar.style.width=incBar.style.width=cjpBar.style.width="0%";
 bjpNum.textContent=incNum.textContent=cjpNum.textContent="0";
 showStatus(`Loading 0/${POSTS.length}…`);

 let successfulPosts=0;
 for(let i=0;i<POSTS.length;i++){
  try{
   const entries=await fetchPost(POSTS[i],i);
   entries.filter(e=>e.type==="comment").forEach(e=>{
    const raw=normalizeVote(e.content);
    if(raw)state.rawVotes.push(raw);
   });
   successfulPosts++;
   showStatus(`Loading ${i+1}/${POSTS.length}…`);
   // Results remain covered until every post has finished.
  }catch(e){
   // A failed post is ignored rather than counted as zero votes.
  }
 }

 if(successfulPosts){
  render();
  setLastFetchTime();
  startReloadCooldown();
  showStatus(`${state.rawVotes.length.toLocaleString("en-IN")} responses`);
  setTimeout(hideStatus,900);
 }else{
  showStatus("Reddit is temporarily unavailable. Please try again shortly.");
  setTimeout(hideStatus,2500);
 }
}

function setCjpHidden(hidden){
 state.isCjpHidden=hidden;
 const wrapper=$("cjp-full-row-wrapper"),restore=$("cjp-restore-container");

 if(hidden){
  wrapper.style.maxHeight=wrapper.scrollHeight+"px";
  requestAnimationFrame(()=>{wrapper.style.maxHeight="0px";wrapper.style.opacity="0";wrapper.style.transform="scaleY(.85)";wrapper.style.pointerEvents="none"});
  setTimeout(()=>{wrapper.classList.add("hidden");restore.classList.remove("hidden")},350);
 }else{
  restore.classList.add("hidden");wrapper.classList.remove("hidden");
  wrapper.style.maxHeight="0px";wrapper.style.opacity="0";wrapper.style.transform="scaleY(.85)";
  requestAnimationFrame(()=>{wrapper.style.maxHeight="140px";wrapper.style.opacity="1";wrapper.style.transform="scaleY(1)"});
 }
 render();
}

$("hide-cjp-btn").addEventListener("click",()=>setCjpHidden(true));
$("restore-cjp-btn").addEventListener("click",()=>setCjpHidden(false));
$("reload-poll-btn").addEventListener("click",()=>{
 if(!updateReloadButton()) return;
 const icon=$("reload-icon");
 icon.classList.add("rotate-180");
 setTimeout(()=>icon.classList.remove("rotate-180"),500);
 loadSurvey();
});

loadSurvey();
});
</script>
</body>
