name: Update Survey Results

on:
  schedule:
    # GitHub Actions requires a minimum of 5 minutes for cron schedules
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - posts.json
      - scripts/update-results.js

permissions:
  contents: write

jobs:
  update-results:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run 2-minute update loop
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Run up to 2 iterations (every 2 minutes) per 5-minute scheduled run
          for i in 1 2; do
            echo "=== Starting update iteration $i ==="
            node scripts/update-results.js
            
            git add results.json
            if git diff --staged --quiet; then
              echo "No changes to results.json in iteration $i"
            else
              git commit -m "chore: update survey results [skip ci]"
              git push
            fi
            
            if [ "$i" -lt 2 ]; then
              echo "Waiting 120 seconds before next check..."
              sleep 120
            fi
          done
