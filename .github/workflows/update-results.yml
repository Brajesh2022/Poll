name: Update Survey Results

on:
  schedule:
    # Backup trigger every 6 hours in case runner restarts
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - posts.json
      - scripts/update-results.js

permissions:
  contents: write
  actions: write

concurrency:
  group: update-survey-results
  cancel-in-progress: false

jobs:
  update-results:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run 6-hour continuous polling loop (checks every 2 min)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Run 170 iterations (every 2 minutes) covering ~5.7 hours per runner
          MAX_ITERATIONS=170
          for ((i=1; i<=MAX_ITERATIONS; i++)); do
            echo "=== Iteration $i / $MAX_ITERATIONS at $(date -u) ==="
            node scripts/update-results.js
            
            git add results.json
            if git diff --staged --quiet; then
              echo "No voting count changes. Skipping commit."
            else
              echo "Voting count changed! Committing and pushing updates..."
              git commit -m "chore: update survey results [skip ci]"
              git pull --rebase origin main || true
              git push
            fi
            
            if [ "$i" -lt "$MAX_ITERATIONS" ]; then
              sleep 120
            fi
          done
          
          # Automatically trigger next 6-hour cycle seamlessly
          echo "6-hour session complete. Triggering next cycle..."
          gh workflow run update-results.yml || true
