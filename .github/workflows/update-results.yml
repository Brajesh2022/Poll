name: Update Survey Results

on:
  schedule:
    # 5-minute schedules with 2-minute offset to maximize trigger reliability on GitHub Actions
    - cron: '*/5 * * * *'
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - posts.json
      - scripts/update-results.js

permissions:
  contents: write

concurrency:
  group: update-survey-results
  cancel-in-progress: false

jobs:
  update-results:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run continuous 2-minute update loop
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Run 4 iterations (every 2 minutes) covering ~6-8 minutes
          for i in 1 2 3 4; do
            echo "=== Starting update iteration $i at $(date -u) ==="
            node scripts/update-results.js
            
            git add results.json
            if git diff --staged --quiet; then
              echo "No changes to results.json in iteration $i"
            else
              git commit -m "chore: update survey results [skip ci]"
              git pull --rebase origin main || true
              git push
            fi
            
            if [ "$i" -lt 4 ]; then
              echo "Waiting 120 seconds before next check..."
              sleep 120
            fi
          done
